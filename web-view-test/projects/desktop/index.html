<html window-frame="extended" window-resizable="false" window-width="850dip" window-height="630dip">

<head>
    <title>Sciter WebView Bridge Test</title>

    <style>
        html,
        body {
            padding: 0;
            margin: 0;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            border-bottom: 1px solid #ccc;
            background: #f6f6f6;
        }

        webview {
            display: block;
            size: *;
            background: #111;
            behavior: webview library(sciter-webview);
        }
    </style>

    <script type="module">
        document.on("ready", () => {
            document.on("click", "#zalupa", () => {
                var wnd = new Window({
                    url: __DIR__ + "./popup.html",
                    state: Window.WINDOW_SHOWN,
                });
            });
        });
    </script>
</head>

<body>
    <div class="toolbar">
        <button id="zalupa">Load Bing</button>
    </div>

    <!-- <webview src="https://www.sciter.com"></webview> -->
</body>

</html>

<html lang="en">
